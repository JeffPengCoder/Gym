# Native Nano Omni VisualWebArena route. Set task_image_root to the same
# read-only image directory in both the agent and resource-server profiles.
config_paths:
  - resources_servers/native_web/configs/native_visualwebarena.yaml
  - responses_api_agents/web_agent/configs/web_agent.yaml

native_visualwebarena_agent:
  _inherit_from: web_agent
  responses_api_agents:
    web_agent:
      resources_server:
        type: resources_servers
        name: native_visualwebarena
      max_steps: 100
      max_parse_retries: 2
      native_action_recovery: repair_single_closing_bracket
      native_tool_alias_recovery: webvoyager_v3
      native_max_computer_actions: 20
      native_parse_retry_feedback: true
      native_parse_retry_temperature: 0.2
      repeated_action_warning_threshold: 0
      max_consecutive_execution_failures: 3
      model_turn_max_retries: 19
      model_retry_delay_secs: 5.0
      max_image_history: 3
      visual_observation_text: none
      redact_old_visual_observations: false
      task_image_root: null
      resources_request_timeout_secs: 1800
      model_request_timeout_secs: 1200
      run_timeout_secs: 14400
      datasets:
        - name: visualwebarena-native-v3
          type: benchmark
          jsonl_fpath: benchmarks/visualwebarena/data/visualwebarena_native_v3.jsonl
          prompt_config: null
          prepare_script: benchmarks/visualwebarena/prepare_native_v3.py
          num_repeats: 1
