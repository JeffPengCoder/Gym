# Nano Omni v3 alignment route. This deliberately does not alter the legacy
# BrowserGym-compatible WebVoyager benchmark in ../config.yaml.
config_paths:
  - resources_servers/native_web/configs/native_web.yaml
  - resources_servers/webvoyager_judge/configs/native_v3.yaml
  - resources_servers/webvoyager_judge/configs/judge_model_gemini_native.yaml
  - responses_api_agents/web_agent/configs/web_agent.yaml

native_webvoyager_resources:
  _inherit_from: native_web

native_webvoyager_judge:
  _inherit_from: webvoyager_native_v3_judge

native_webvoyager_agent:
  _inherit_from: web_agent
  responses_api_agents:
    web_agent:
      resources_server:
        type: resources_servers
        name: native_webvoyager_resources
      webvoyager_judge_server:
        type: resources_servers
        name: native_webvoyager_judge
      max_steps: 100
      max_parse_retries: 2
      model_turn_max_retries: 2
      model_retry_delay_secs: 1.0
      max_image_history: 3
      judge_max_screenshots: 200
      visual_observation_text: none
      redact_old_visual_observations: false
      model_request_timeout_secs: 1200
      judge_request_timeout_secs: 120
      judge_max_retries: 3
      judge_retry_initial_delay_secs: 5
      judge_retry_max_delay_secs: 5
      run_timeout_secs: 14400
      datasets:
        - name: webvoyager-native-v3
          type: benchmark
          jsonl_fpath: benchmarks/webvoyager/data/webvoyager_native_v3.jsonl
          prompt_config: null
          prepare_script: benchmarks/webvoyager/prepare_native_v3.py
          num_repeats: 1
