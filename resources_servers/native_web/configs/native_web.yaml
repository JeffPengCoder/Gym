native_web:
  resources_servers:
    native_web:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Headed Chromium native WebVoyager runtime with Playwright lifecycle and PyAutoGUI actions
      value: Reproduce the Nano Omni screenshot/tool-call browser contract behind the Gym web protocol
      # PyAutoGUI controls one process-global X display. Scale with 16
      # resource-server replicas/displays, never 16 sessions in one display.
      max_sessions: 1
      artifact_dir: cache/native-web/artifacts
      inline_screenshots: true
      max_evidence_screenshots: 200
      headless: false
      viewport_width: 1920
      viewport_height: 1080
      action_delay_seconds: 2.0
      proxy_mode: webvoyager_domains
      require_captcha_solver: true
      record_video: false
      session_ttl_seconds: 14400
      reaper_interval_seconds: 60
      require_auth: false
      site_pool_mode: unmanaged
      allowed_benchmarks: [webvoyager]
