native_visualwebarena:
  resources_servers:
    native_web:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Headed Chromium/PyAutoGUI runtime with the native VisualWebArena evaluator
      value: Run the maintained Nano Omni VisualWebArena recipe behind Gym's web protocol
      max_sessions: 1
      artifact_dir: cache/native-visualwebarena/artifacts
      inline_screenshots: true
      max_evidence_screenshots: 200
      headless: false
      viewport_width: 1920
      viewport_height: 1080
      action_delay_seconds: 2.0
      terminate_on_action_error: false
      max_computer_actions: 20
      record_video: false
      session_ttl_seconds: 14400
      reaper_interval_seconds: 60
      require_auth: false
      site_pool_mode: local_locks
      # Override this with the read-only directory containing the 346 task
      # images before launch. Relative JSONL references are confined below it.
      task_image_root: null
      allowed_benchmarks: [visualwebarena]
