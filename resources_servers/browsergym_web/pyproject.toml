[project]
name = "browsergym-web-resources-server"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nemo-gym[dev]",
    "browsergym-webarena==0.14.3",
    "browsergym-visualwebarena==0.14.3",
    "Pillow>=10",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["resources_servers.browsergym_web*"]

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }
